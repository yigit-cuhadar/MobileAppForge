name: forge_purchases
description: MobileAppForge shared package.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  forge_core:
    path: ../forge_core
  get_it: ^9.3.0
  http: ^1.6.0
  purchases_flutter: ^11.0.4
  purchases_ui_flutter: ^11.0.4
  shared_preferences: ^2.5.6

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ForgePurchasesPlugin
