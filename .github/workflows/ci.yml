name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version used locally; upgrade deliberately.
          flutter-version: 3.47.1
          cache: true
      - name: Packages
        run: tools/check.sh
      - name: Template scaffolds and analyzes
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          tools/new_app.sh smoke_app com.example --local
          cd apps/smoke_app
          dart format --output=none --set-exit-if-changed lib
          flutter analyze
          cd widgetbook
          dart run build_runner build -d
          flutter analyze
      - name: Widgetbook generates, analyzes and builds
        working-directory: widgetbook
        run: |
          flutter pub get
          dart run build_runner build -d
          dart format --output=none --set-exit-if-changed lib
          flutter analyze
          flutter build web
